<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#08324f" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#041829" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#020a12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#01050a" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="centerCoreGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#087bff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020a12" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Perspective Gradients -->
    <linearGradient id="floorFade" x1="50%" y1="65%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#087bff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020a12" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Light Beams -->
    <linearGradient id="beamGradient" x1="50%" y1="0%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#087bff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020a12" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Futuristic Canvas -->
  <rect width="1920" height="1080" fill="#020a12"/>
  <rect width="1920" height="1080" fill="url(#spaceGlow)"/>
  <rect width="1920" height="1080" fill="url(#centerCoreGlow)"/>

  <!-- Light Beam Pillars -->
  <polygon points="960,0 800,850 1120,850" fill="url(#beamGradient)" opacity="0.6"/>
  <polygon points="960,0 880,750 1040,750" fill="url(#beamGradient)" opacity="0.4"/>

  <!-- Perspective Holographic Energy Platform (Floor Grid) -->
  <g opacity="0.35">
    <ellipse cx="960" cy="880" rx="640" ry="140" fill="none" stroke="#00e5ff" stroke-width="2" filter="url(#glow)" opacity="0.4"/>
    <ellipse cx="960" cy="880" rx="520" ry="110" fill="none" stroke="#087bff" stroke-width="1.5" stroke-dasharray="16 8" opacity="0.5"/>
    <ellipse cx="960" cy="880" rx="380" ry="80" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="12 6" opacity="0.4"/>
    <ellipse cx="960" cy="880" rx="240" ry="50" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.3"/>

    <!-- Radial Perspective Lines Radiating from Horizon -->
    <line x1="960" y1="740" x2="320" y2="1080" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="960" y1="740" x2="520" y2="1080" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="960" y1="740" x2="720" y2="1080" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="960" y1="740" x2="960" y2="1080" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="960" y1="740" x2="1200" y2="1080" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="960" y1="740" x2="1400" y2="1080" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="960" y1="740" x2="1600" y2="1080" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Concentric Grid Ellipses -->
    <path d="M 440,940 Q 960,1020 1480,940" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.25"/>
    <path d="M 540,900 Q 960,970 1380,900" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.25"/>
    <path d="M 640,860 Q 960,920 1280,860" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- Ambient Holographic Particles -->
  <g opacity="0.4">
    <circle cx="820" cy="320" r="1.5" fill="#00e5ff"/>
    <circle cx="1100" cy="280" r="2" fill="#00e5ff" filter="url(#glow)"/>
    <circle cx="750" cy="460" r="1.5" fill="#087bff"/>
    <circle cx="1180" cy="420" r="1.5" fill="#00e5ff"/>
    <circle cx="910" cy="240" r="2.5" fill="#00e5ff" filter="url(#glow)"/>
    <circle cx="1020" cy="230" r="1.5" fill="#00e5ff"/>
    <circle cx="860" cy="540" r="1.5" fill="#00a8cc"/>
    <circle cx="1060" cy="560" r="2" fill="#00e5ff"/>
    <circle cx="780" cy="620" r="1" fill="#087bff"/>
    <circle cx="1140" cy="640" r="1.5" fill="#00e5ff"/>
  </g>
</svg>

