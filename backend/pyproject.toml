[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alex-backend"
version = "0.1.0"
description = "Python sidecar backend for the Alex desktop assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "keyring>=25,<26",
    "google-genai>=1.30,<2",
    "httpx>=0.28,<1",
    "psutil>=5.9,<8",
    "pyautogui>=0.9.54,<1",
    "pyperclip>=1.9,<2",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "openwakeword>=0.6.0",
    "yt-dlp>=2024.0.0",
    "numpy>=1.26.0",
    "cryptography>=42.0.0",
    "qrcode[pil]>=7.4",
    "opencv-python>=4.8.0",
]

[project.scripts]
alex = "launcher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
